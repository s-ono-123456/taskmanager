# タスク管理自動化パイロットの管理画面（外部通信は原則なし。唯一の例外はMattermost
# collector、後述の環境変数参照。全体構想は docs/design/task-management-automation.md 参照）。
# 実データ（SQLite）は /docker/task-dashboard/data に置く（git管理下の外に置き、サイズが
# 大きい・頻繁に変化するデータを本リポジトリに含めないため）。
services:
  task-dashboard:
    build:
      context: ..
      dockerfile: build/Dockerfile
    image: task-dashboard:latest
    container_name: task-dashboard
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TASK_DASHBOARD_HOST: "0.0.0.0"
      TASK_DASHBOARD_PORT: "8090"
      TASK_DASHBOARD_DB_PATH: "/data/task_dashboard.db"
      # パイロット段階のみ: DBが空ならサンプルデータを自動投入する。
      # collector/extractor等の実連携を組み込んだら "0" にすること。
      TASK_DASHBOARD_AUTO_SEED: "1"
      # Mattermost collector用(任意)。ホスト側の環境変数、またはcompose/.env
      # (git管理外、.gitignore対象)から値を引き継ぐ。未設定なら空文字のままで
      # collectorは起動しない(internal/mattermost.LoadConfigFromEnv参照)。
      # 実際のトークン値はこのファイルにもリポジトリのどこにも書かないこと。
      MATTERMOST_BOT_TOKEN: ${MATTERMOST_BOT_TOKEN:-}
      MATTERMOST_SERVER_URL: ${MATTERMOST_SERVER_URL:-}
      MATTERMOST_CHANNEL_ROUTES: ${MATTERMOST_CHANNEL_ROUTES:-}
    volumes:
      - /docker/task-dashboard/data:/data
